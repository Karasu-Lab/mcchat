def releaseModules = subprojects.findAll { it.path.startsWith(':modules:') && it.hasProperty('releasePath') }

tasks.register('releaseMatrix') {
	group = 'release'
	def matrix = groovy.json.JsonOutput.toJson(releaseModules.collect {
		[
			name: it.name,
			path: it.property('releasePath'),
			'working-directory': it.property('releaseWorkingDirectory'),
			tasks: it.property('releaseTasks'),
			files: it.property('releaseFiles')
		]
	})
	doLast {
		println matrix
	}
}

subprojects {
	plugins.withId('java') {
		def javaVersion = JavaVersion.toVersion(rootProject.java_version)

		java {
			sourceCompatibility = javaVersion
			targetCompatibility = javaVersion
		}

		tasks.withType(JavaCompile).configureEach {
			it.options.release = javaVersion.majorVersion.toInteger()
		}
	}
}
