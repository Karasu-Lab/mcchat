subprojects {
	plugins.withId('java') {
		def javaVersion = JavaVersion.toVersion(rootProject.java_version)

		java {
			sourceCompatibility = javaVersion
			targetCompatibility = javaVersion
		}

		tasks.withType(JavaCompile).configureEach {
			it.options.release = javaVersion.majorVersion.toInteger()
		}
	}
}
