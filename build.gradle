def releaseModules = subprojects.findAll { it.path.startsWith(':modules:') }

tasks.register('releaseMatrix') {
	group = 'release'
	def matrix = groovy.json.JsonOutput.toJson(releaseModules.collect {
		[
			name: it.name,
			path: it.property('releasePath'),
			'version-file': it.property('releaseVersionFile'),
			'fallback-version': it.property('releaseFallbackVersion'),
			'working-directory': it.property('releaseWorkingDirectory'),
			tasks: it.property('releaseTasks'),
			files: it.property('releaseFiles')
		]
	})
	doLast {
		println matrix
	}
}

subprojects {
	if (path.startsWith(':modules:')) {
		tasks.register('setVersion') {
			group = 'release'
			def versionFile = rootProject.file(project.property('releaseVersionFile'))
			def newVersion = providers.gradleProperty('newVersion')
			doLast {
				versionFile.text = versionFile.text.replaceFirst(/(?m)^version=.*$/, "version=${newVersion.get()}")
			}
		}
	}

	plugins.withId('java') {
		def javaVersion = JavaVersion.toVersion(rootProject.java_version)

		java {
			sourceCompatibility = javaVersion
			targetCompatibility = javaVersion
		}

		tasks.withType(JavaCompile).configureEach {
			it.options.release = javaVersion.majorVersion.toInteger()
		}
	}
}
