name: release
on:
  push:
    branches: [main]

jobs:
  release-please:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    outputs:
      paths_released: ${{ steps.release.outputs.paths_released }}
      releases_created: ${{ steps.release.outputs.releases_created }}
      tags: ${{ toJSON(steps.release.outputs) }}
    steps:
      - name: release please
        id: release
        uses: googleapis/release-please-action@v4

  modules:
    needs: release-please
    if: needs.release-please.outputs.releases_created == 'true'
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: setup gradle
        uses: gradle/actions/setup-gradle@v6
      - name: list release modules
        id: matrix
        run: |
          chmod +x ./gradlew
          echo "matrix={\"include\":$(./gradlew -q releaseMatrix)}" >> "$GITHUB_OUTPUT"

  publish:
    needs: [release-please, modules]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.modules.outputs.matrix) }}
    env:
      RELEASED: ${{ contains(fromJSON(needs.release-please.outputs.paths_released), matrix.path) }}
    steps:
      - name: checkout repository
        if: env.RELEASED == 'true'
        uses: actions/checkout@v6
      - name: setup jdk
        if: env.RELEASED == 'true'
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: setup gradle
        if: env.RELEASED == 'true'
        uses: gradle/actions/setup-gradle@v6
      - name: build
        if: env.RELEASED == 'true'
        working-directory: ${{ matrix.working-directory }}
        env:
          SIGNING_PRIVATE_KEY: ${{ secrets.SIGNING_PRIVATE_KEY }}
          SIGNING_PASSPHRASE: ${{ secrets.SIGNING_PASSPHRASE }}
          SIGNING_KEY_ID: ${{ vars.SIGNING_KEY_ID }}
        run: |
          chmod +x ./gradlew
          ./gradlew ${{ matrix.tasks }}
      - name: sign android artifacts
        if: env.RELEASED == 'true' && matrix.path == 'apps/MCChatNative'
        env:
          SIGNING_PRIVATE_KEY: ${{ secrets.SIGNING_PRIVATE_KEY }}
          SIGNING_PASSPHRASE: ${{ secrets.SIGNING_PASSPHRASE }}
          SIGNING_KEY_ID: ${{ vars.SIGNING_KEY_ID }}
        run: |
          set -euo pipefail
          printf '%s' "$SIGNING_PRIVATE_KEY" | gpg --batch --import
          for file in apps/MCChatNative/app/build/outputs/apk/*/*.apk apps/MCChatNative/app/build/outputs/bundle/*/*.aab; do
            printf '%s' "$SIGNING_PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 --local-user "${SIGNING_KEY_ID}!" --sign --output "$file.gpg" "$file"
          done
      - name: upload files and publish release
        if: env.RELEASED == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ fromJSON(needs.release-please.outputs.tags)[format('{0}--tag_name', matrix.path)] }}
          MODULE_PATH: ${{ matrix.path }}
          MODULE_FILES: ${{ matrix.files }}
          MODULE_VERSION: ${{ fromJSON(needs.release-please.outputs.tags)[format('{0}--version', matrix.path)] }}
        run: |
          set -euo pipefail

          files=()
          shopt -s nullglob
          for pattern in $MODULE_FILES; do
            matches=( $pattern )
            if [ "${#matches[@]}" -gt 0 ]; then
              files+=( "${matches[@]}" )
            fi
          done
          shopt -u nullglob

          if [ "${#files[@]}" -eq 0 ]; then
            echo "No build artifacts matched: $MODULE_FILES" >&2
            exit 1
          fi

          gh release upload "$TAG_NAME" "${files[@]}" --clobber

          gh release view "$TAG_NAME" --json body --jq '.body // ""' > "${RUNNER_TEMP}/release-body.md"

          start="<!-- mcchat-file-table:${MODULE_PATH}:start -->"
          end="<!-- mcchat-file-table:${MODULE_PATH}:end -->"
          awk -v start="$start" -v end="$end" '
            $0 == start { skipping = 1; next }
            $0 == end { skipping = 0; next }
            !skipping { print }
          ' "${RUNNER_TEMP}/release-body.md" > "${RUNNER_TEMP}/release-body-base.md"

          {
            cat "${RUNNER_TEMP}/release-body-base.md"
            echo
            echo "$start"
            echo
            echo "| File | Version | SHA256 |"
            echo "| --- | --- | --- |"
            for file in "${files[@]}"; do
              echo "| \`$(basename "$file")\` | $MODULE_VERSION | \`$(sha256sum "$file" | cut -d' ' -f1)\` |"
            done
            echo
            echo "$end"
          } > "${RUNNER_TEMP}/release-body-new.md"

          gh release edit "$TAG_NAME" --notes-file "${RUNNER_TEMP}/release-body-new.md" --draft=false
