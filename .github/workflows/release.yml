name: release
on:
  push:
    branches: [main]

concurrency:
  group: release

jobs:
  prepare:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: mcchat
            path: mods/mcchat
            version-file: mods/mcchat/gradle.properties
            fallback-version: 1.0.1
          - name: mcchat-native
            path: apps/MCChatNative
            version-file: apps/MCChatNative/app/gradle.properties
            fallback-version: 1.1.0
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: update version and changelog
        id: changelog
        uses: TriPSs/conventional-changelog-action@v6
        with:
          github-token: ${{ secrets.RELEASE_TOKEN || github.token }}
          preset: conventionalcommits
          git-path: ${{ matrix.path }}
          tag-prefix: ${{ matrix.name }}-v
          fallback-version: ${{ matrix.fallback-version }}
          version-file: ${{ matrix.version-file }}
          input-file: CHANGELOG.md
          output-file: CHANGELOG.md
          skip-commit: 'true'
          skip-tag: 'true'
          git-push: 'false'
          skip-git-pull: 'true'
      - name: create or update release pull request
        if: steps.changelog.outputs.skipped == 'false'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.RELEASE_TOKEN || github.token }}
          branch: release/${{ matrix.name }}
          base: main
          add-paths: |
            CHANGELOG.md
            ${{ matrix.version-file }}
          commit-message: "release: ${{ matrix.name }} v${{ steps.changelog.outputs.version }}"
          title: "release: ${{ matrix.name }} v${{ steps.changelog.outputs.version }}"
          body: "Merging this pull request publishes ${{ matrix.name }} v${{ steps.changelog.outputs.version }}."

  publish:
    if: "${{ contains(toJSON(github.event.commits.*.message), 'release: ') }}"
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: mcchat
            working-directory: .
            tasks: ':mods:mcchat:build'
            files: mods/mcchat/build/libs/*.jar
          - name: mcchat-native
            working-directory: apps
            tasks: build
            files: apps/MCChatNative/app/build/outputs/apk/*/*.apk
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: release
        id: release
        if: "${{ contains(toJSON(github.event.commits.*.message), format('release: {0} v', matrix.name)) }}"
        uses: CupOfTea696/gh-action-auto-release@v1.0.0
        with:
          title: "${{ matrix.name }} $semver"
          tag: "${{ matrix.name }}-v$semver"
          changelog-entry: "$semver"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: setup jdk
        if: steps.release.outputs.released == 'true'
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: setup gradle
        if: steps.release.outputs.released == 'true'
        uses: gradle/actions/setup-gradle@v6
      - name: build
        if: steps.release.outputs.released == 'true'
        working-directory: ${{ matrix.working-directory }}
        run: |
          chmod +x ./gradlew
          ./gradlew ${{ matrix.tasks }}
      - name: write file table
        if: steps.release.outputs.released == 'true'
        run: |
          {
            echo "| File | Version | SHA256 |"
            echo "| --- | --- | --- |"
            for file in ${{ matrix.files }}; do
              echo "| \`$(basename "$file")\` | ${{ steps.release.outputs.version }} | \`$(sha256sum "$file" | cut -d' ' -f1)\` |"
            done
          } > "${{ runner.temp }}/files.md"
      - name: upload files and append table
        if: steps.release.outputs.released == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ matrix.name }}-v${{ steps.release.outputs.version }}
          files: ${{ matrix.files }}
          body_path: ${{ runner.temp }}/files.md
          append_body: true
