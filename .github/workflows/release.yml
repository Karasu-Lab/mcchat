name: release
on:
  push:
    branches: [main]

concurrency:
  group: release

jobs:
  modules:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: setup gradle
        uses: gradle/actions/setup-gradle@v6
      - name: list release modules
        id: matrix
        run: |
          chmod +x ./gradlew
          echo "matrix={\"include\":$(./gradlew -q releaseMatrix)}" >> "$GITHUB_OUTPUT"

  prepare:
    needs: modules
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.modules.outputs.matrix) }}
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: update version and changelog
        id: changelog
        uses: TriPSs/conventional-changelog-action@v6
        with:
          github-token: ${{ secrets.RELEASE_TOKEN || github.token }}
          preset: conventionalcommits
          git-path: ${{ matrix.path }}
          tag-prefix: ${{ matrix.name }}-v
          fallback-version: ${{ matrix.fallback-version }}
          skip-version-file: 'true'
          input-file: CHANGELOG.md
          output-file: CHANGELOG.md
          skip-commit: 'true'
          skip-tag: 'true'
          git-push: 'false'
          skip-git-pull: 'true'
      - name: setup jdk
        if: steps.changelog.outputs.skipped == 'false'
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: setup gradle
        if: steps.changelog.outputs.skipped == 'false'
        uses: gradle/actions/setup-gradle@v6
      - name: bump version with gradle
        if: steps.changelog.outputs.skipped == 'false'
        run: |
          chmod +x ./gradlew
          ./gradlew :modules:${{ matrix.name }}:setVersion -PnewVersion=${{ steps.changelog.outputs.version }}
      - name: create or update release pull request
        if: steps.changelog.outputs.skipped == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: release/${{ matrix.name }}
          TITLE: "release: ${{ matrix.name }} v${{ steps.changelog.outputs.version }}"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add CHANGELOG.md "${{ matrix.version-file }}"
          git commit -m "$TITLE"
          if git fetch origin "$BRANCH"; then
            git merge -s ours --no-edit FETCH_HEAD
          fi
          git push origin "$BRANCH"
          body="Merging this pull request publishes ${{ matrix.name }} v${{ steps.changelog.outputs.version }}."
          if [ "$(gh pr list --head "$BRANCH" --state open --json number --jq length)" = "0" ]; then
            gh pr create --base main --head "$BRANCH" --title "$TITLE" --body "$body"
          else
            gh pr edit "$BRANCH" --title "$TITLE" --body "$body"
          fi

  publish:
    needs: modules
    if: "${{ contains(toJSON(github.event.commits.*.message), 'release: ') }}"
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.modules.outputs.matrix) }}
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: release
        id: release
        if: "${{ contains(toJSON(github.event.commits.*.message), format('release: {0} v', matrix.name)) }}"
        uses: CupOfTea696/gh-action-auto-release@v1.0.0
        with:
          title: "${{ matrix.name }} $semver"
          tag: "${{ matrix.name }}-v$semver"
          changelog-entry: "$semver"
          draft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: setup jdk
        if: steps.release.outputs.released == 'true'
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: setup gradle
        if: steps.release.outputs.released == 'true'
        uses: gradle/actions/setup-gradle@v6
      - name: build
        if: steps.release.outputs.released == 'true'
        working-directory: ${{ matrix.working-directory }}
        run: |
          chmod +x ./gradlew
          ./gradlew ${{ matrix.tasks }}
      - name: write file table
        if: steps.release.outputs.released == 'true'
        run: |
          {
            echo "| File | Version | SHA256 |"
            echo "| --- | --- | --- |"
            for file in ${{ matrix.files }}; do
              echo "| \`$(basename "$file")\` | ${{ steps.release.outputs.version }} | \`$(sha256sum "$file" | cut -d' ' -f1)\` |"
            done
          } > "${{ runner.temp }}/files.md"
      - name: upload files and append table
        if: steps.release.outputs.released == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ matrix.name }}-v${{ steps.release.outputs.version }}
          files: ${{ matrix.files }}
          body_path: ${{ runner.temp }}/files.md
          append_body: true
