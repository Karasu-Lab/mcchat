name: release
on:
  push:
    branches: [main]

concurrency:
  group: release

jobs:
  prepare:
    if: "${{ !contains(toJSON(github.event.commits.*.message), 'release: ') }}"
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}
      - name: update versions and changelog
        id: prepare
        run: python3 .github/scripts/prepare_release.py
      - name: push release branch
        if: steps.prepare.outputs.released == 'true'
        env:
          MESSAGE: ${{ steps.prepare.outputs.message }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b release/next
          git add CHANGELOG.md mods/mcchat/gradle.properties apps/MCChatNative/app/build.gradle.kts
          git commit -m "$MESSAGE"
          git push --force origin release/next
      - name: create or update release pull request
        if: steps.prepare.outputs.released == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          MESSAGE: ${{ steps.prepare.outputs.message }}
        run: |
          body="Merging this pull request publishes the releases listed in the title. See CHANGELOG.md for the release notes."
          if gh pr view release/next --json state --jq '.state' | grep -q '^OPEN$'; then
            gh pr edit release/next --title "$MESSAGE" --body "$body"
          else
            gh pr create --head release/next --base main --title "$MESSAGE" --body "$body"
          fi

  publish:
    if: "${{ contains(toJSON(github.event.commits.*.message), 'release: ') }}"
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: release mod
        uses: CupOfTea696/gh-action-auto-release@v1.0.0
        with:
          title: "mcchat $semver"
          tag: "mcchat-v$semver"
          changelog-entry: "[mcchat] $semver"
          regex: "/mcchat v#{semver}/"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: release app
        uses: CupOfTea696/gh-action-auto-release@v1.0.0
        with:
          title: "mcchat-native $semver"
          tag: "mcchat-native-v$semver"
          changelog-entry: "[mcchat-native] $semver"
          regex: "/mcchat-native v#{semver}/"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
