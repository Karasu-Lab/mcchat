name: release
on:
  push:
    branches: [main]

jobs:
  release-please:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    outputs:
      paths_released: ${{ steps.release.outputs.paths_released }}
      releases_created: ${{ steps.release.outputs.releases_created }}
      tags: ${{ toJSON(steps.release.outputs) }}
    steps:
      - name: release please
        id: release
        uses: googleapis/release-please-action@v4

  modules:
    needs: release-please
    if: needs.release-please.outputs.releases_created == 'true'
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: setup gradle
        uses: gradle/actions/setup-gradle@v6
      - name: list release modules
        id: matrix
        run: |
          chmod +x ./gradlew
          echo "matrix={\"include\":$(./gradlew -q releaseMatrix)}" >> "$GITHUB_OUTPUT"

  publish:
    needs: [release-please, modules]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.modules.outputs.matrix) }}
    env:
      RELEASED: ${{ contains(fromJSON(needs.release-please.outputs.paths_released), matrix.path) }}
    steps:
      - name: checkout repository
        if: env.RELEASED == 'true'
        uses: actions/checkout@v6
      - name: setup jdk
        if: env.RELEASED == 'true'
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: setup gradle
        if: env.RELEASED == 'true'
        uses: gradle/actions/setup-gradle@v6
      - name: build
        if: env.RELEASED == 'true'
        working-directory: ${{ matrix.working-directory }}
        run: |
          chmod +x ./gradlew
          ./gradlew ${{ matrix.tasks }}
      - name: write file table
        if: env.RELEASED == 'true'
        run: |
          {
            echo "| File | Version | SHA256 |"
            echo "| --- | --- | --- |"
            for file in ${{ matrix.files }}; do
              echo "| \`$(basename "$file")\` | ${{ fromJSON(needs.release-please.outputs.tags)[format('{0}--version', matrix.path)] }} | \`$(sha256sum "$file" | cut -d' ' -f1)\` |"
            done
          } > "${{ runner.temp }}/files.md"
      - name: upload files, append table and publish release
        if: env.RELEASED == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ fromJSON(needs.release-please.outputs.tags)[format('{0}--tag_name', matrix.path)] }}
          files: ${{ matrix.files }}
          body_path: ${{ runner.temp }}/files.md
          append_body: true
          draft: false
