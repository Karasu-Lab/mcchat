# Automatically build the project and run any configured tests for every push
# and submitted pull request. This can help catch issues that only occur on
# certain platforms or Java versions, and provides a first line of defence
# against bad commits.

name: build
on:
  pull_request:
    paths-ignore:
      - 'apps/**'
      - '.github/workflows/android.yml'
  push:
    paths-ignore:
      - 'apps/**'
      - '.github/workflows/android.yml'

jobs:
  format:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: download google-java-format
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download --repo google/google-java-format --pattern '*all-deps.jar' --output google-java-format.jar
      - name: format java sources
        run: |
          find mods -path '*/src/*' -name '*.java' -print0 | xargs -0 -r java \
            --add-exports=jdk.compiler/com.sun.tools.javac.api=ALL-UNNAMED \
            --add-exports=jdk.compiler/com.sun.tools.javac.file=ALL-UNNAMED \
            --add-exports=jdk.compiler/com.sun.tools.javac.parser=ALL-UNNAMED \
            --add-exports=jdk.compiler/com.sun.tools.javac.tree=ALL-UNNAMED \
            --add-exports=jdk.compiler/com.sun.tools.javac.util=ALL-UNNAMED \
            -jar google-java-format.jar --replace
      - name: commit formatted sources
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mods
          if ! git diff --cached --quiet; then
            git commit -m "style: format java sources with google-java-format"
            git push
          fi

  build:
    needs: format
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build
        run: ./gradlew build
      - name: capture build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Artifacts
          path: mods/*/build/libs/
