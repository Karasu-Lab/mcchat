name: android-release
on:
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - '.github/workflows/android-release.yml'
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: setup gradle
        uses: gradle/actions/setup-gradle@v6
      - name: build
        env:
          SIGNING_PRIVATE_KEY: ${{ secrets.SIGNING_PRIVATE_KEY }}
          SIGNING_PASSPHRASE: ${{ secrets.SIGNING_PASSPHRASE }}
          SIGNING_KEY_ID: ${{ vars.SIGNING_KEY_ID }}
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          commit="$(git rev-parse --short HEAD)"
          version="$(grep '^version=' MCChatNative/app/gradle.properties | cut -d= -f2)-${commit}"
          ./gradlew -PcommitHash="${commit}" assembleRelease bundleRelease
          mv MCChatNative/app/build/outputs/apk/release/*.apk "MCChatNative/app/build/outputs/apk/release/mcchatnative-${version}.apk"
          mv MCChatNative/app/build/outputs/bundle/release/*.aab "MCChatNative/app/build/outputs/bundle/release/mcchatnative-${version}.aab"
      - name: capture release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Android Release Artifacts
          path: |
            apps/MCChatNative/app/build/outputs/apk/release/*.apk
            apps/MCChatNative/app/build/outputs/bundle/release/*.aab
