name: resolve conflicts
on:
  push:
    branches: [main]
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  detect:
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: read
    outputs:
      matrix: ${{ steps.detect.outputs.matrix }}
      found: ${{ steps.detect.outputs.found }}
    steps:
      - name: find conflicting pull requests
        id: detect
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          for attempt in 1 2 3 4 5; do
            prs=$(gh pr list --state open --json number,headRefName,baseRefName,mergeable,isCrossRepository)
            if ! jq -e 'any(.[]; .mergeable == "UNKNOWN")' <<< "$prs" > /dev/null; then
              break
            fi
            sleep 10
          done
          conflicting=$(jq -c '[.[] | select(.mergeable == "CONFLICTING" and (.isCrossRepository | not)) | {number, head: .headRefName, base: .baseRefName}]' <<< "$prs")
          echo "matrix={\"include\":$conflicting}" >> "$GITHUB_OUTPUT"
          echo "found=$(jq 'length > 0' <<< "$conflicting")" >> "$GITHUB_OUTPUT"

  resolve:
    needs: detect
    if: needs.detect.outputs.found == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.detect.outputs.matrix) }}
    concurrency:
      group: resolve-conflicts-${{ matrix.number }}
      cancel-in-progress: false
    steps:
      - name: checkout pull request branch
        uses: actions/checkout@v6
        with:
          ref: ${{ matrix.head }}
          fetch-depth: 0
      - name: configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: merge base branch
        id: merge
        run: |
          git fetch origin "${{ matrix.base }}"
          if git merge --no-edit "origin/${{ matrix.base }}"; then
            echo "clean=true" >> "$GITHUB_OUTPUT"
          else
            echo "clean=false" >> "$GITHUB_OUTPUT"
          fi
      - name: resolve conflicts
        if: steps.merge.outputs.clean == 'false'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: --allowed-tools "Bash(git:*),Read,Edit,Write"
          prompt: |
            A merge of origin/${{ matrix.base }} into the checked-out branch
            ${{ matrix.head }} (pull request #${{ matrix.number }}) stopped with conflicts.
            Resolve every conflicted file so that the intent of both sides is kept,
            remove all conflict markers, stage the files, and complete the merge
            commit with `git commit --no-edit`. Do not push and do not change
            files that are not conflicted.
      - name: push resolved branch
        run: |
          if [ -n "$(git diff --name-only --diff-filter=U)" ]; then
            echo "Unresolved conflicts remain" >&2
            exit 1
          fi
          git push origin "HEAD:${{ matrix.head }}"
